name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates-powershell:
    name: Autodev gates (Windows PowerShell)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run gate tracker tests
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File plugins/autodev/tests/gates.tests.ps1

  stages-powershell:
    name: Autodev stages (Windows PowerShell)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run stage tracker tests
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File plugins/autodev/tests/stages.tests.ps1

  gates-bash:
    name: Autodev gates (bash)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = "macOS" ]; then brew install jq; else sudo apt-get update && sudo apt-get install -y jq; fi
          fi
      - name: Run gate tracker tests
        run: bash plugins/autodev/tests/gates.tests.sh

  stages-bash:
    name: Autodev stages (bash)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = "macOS" ]; then brew install jq; else sudo apt-get update && sudo apt-get install -y jq; fi
          fi
      - name: Run stage tracker tests
        run: bash plugins/autodev/tests/stages.tests.sh

  factory-tests:
    name: Autodev factory (Node)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run factory unit tests
        # The SDK is injected by the CLI into the extension host, so it cannot be installed here.
        # register-stub.mjs resolves it to a local stub; the factory guards its joinSession call
        # behind AUTODEV_FACTORY_TEST so importing the module does not try to talk to a CLI.
        run: node --import ./plugins/autodev-factory/tests/register-stub.mjs --test plugins/autodev-factory/tests/factory.tests.mjs

  workflow-canvas-tests:
    name: Autodev workflow canvas (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run workflow canvas unit tests
        run: node --test plugins/autodev/tests/workflow-canvas.tests.mjs

  manifests:
    name: Manifests and line endings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON manifests
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          status=0
          while IFS= read -r f; do
            if jq empty "$f" 2>/dev/null; then
              echo "ok   $f"
            else
              echo "FAIL $f is not valid JSON"; status=1
            fi
          done < <(find . -name '*.json' -not -path './.git/*')
          exit $status
      - name: Plugin layout must contain exactly two plugins
        run: |
          expected="autodev autodev-factory"
          actual="$(find plugins -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | tr '\n' ' ' | sed 's/[[:space:]]*$//')"
          if [ "$actual" != "$expected" ]; then
            echo "FAIL expected plugin dirs: $expected"; echo "     actual: $actual"; exit 1
          fi
      - name: Shell hooks must use LF endings
        run: |
          # A CRLF shebang line makes the hook unrunnable on Linux and macOS.
          status=0
          while IFS= read -r f; do
            if grep -qU $'\r' "$f"; then echo "FAIL $f contains CR"; status=1; else echo "ok   $f"; fi
          done < <(find . -name '*.sh' -not -path './.git/*')
          exit $status
      - name: Telemetry emitter canonical files must exist
        run: |
          # The consolidated layout has one canonical emitter copy in autodev. The sync script
          # is kept so additional plugin copies can be added safely in the future; for now this
          # verifies the canonical files are present and readable.
          bash scripts/sync-otel-emitter.sh --check
      - name: Autodev factory prompt bundle must not drift
        run: |
          # The autodev factory carries the reviewer and worker instructions in its prompts,
          # because a factory subagent cannot be given an agent_type. The bundle is generated
          # from the canonical .agent.md files; this fails if one was edited without
          # regenerating it.
          bash scripts/sync-autodev-prompts.sh --check
      - name: Plugin extensions must parse
        run: |
          # A syntax error here would only surface as an extension that silently fails to load.
          # Every extension module under plugins/ and samples/ is checked, so
          # a new one cannot be added without being covered.
          status=0
          count=0
          while IFS= read -r f; do
            count=$((count + 1))
            if node --experimental-vm-modules -e "
              const fs = require('node:fs');
              const vm = require('node:vm');
              new vm.SourceTextModule(fs.readFileSync(process.argv[1], 'utf8'));
            " "$f"; then
              echo "ok   $f"
            else
              echo "FAIL $f does not parse"; status=1
            fi
          done < <(find plugins samples -path '*/extensions/*' -name '*.mjs' | sort)
          if [ "$count" -eq 0 ]; then
            echo "FAIL found no extension modules to check — has the layout moved?"; status=1
          fi
          exit $status
