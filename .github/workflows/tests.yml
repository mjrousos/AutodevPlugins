name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gates-powershell:
    name: Gate tracker (Windows PowerShell)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run gate tracker tests
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File plugins/autodev-plan/tests/gates.tests.ps1

  gates-bash:
    name: Gate tracker (bash)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = "macOS" ]; then brew install jq; else sudo apt-get update && sudo apt-get install -y jq; fi
          fi
      - name: Run gate tracker tests
        run: bash plugins/autodev-plan/tests/gates.tests.sh

  manifests:
    name: Manifests and line endings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON manifests
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          status=0
          while IFS= read -r f; do
            if jq empty "$f" 2>/dev/null; then
              echo "ok   $f"
            else
              echo "FAIL $f is not valid JSON"; status=1
            fi
          done < <(find . -name '*.json' -not -path './.git/*')
          exit $status
      - name: Shell hooks must use LF endings
        run: |
          # A CRLF shebang line makes the hook unrunnable on Linux and macOS.
          status=0
          while IFS= read -r f; do
            if grep -qU $'\r' "$f"; then echo "FAIL $f contains CR"; status=1; else echo "ok   $f"; fi
          done < <(find . -name '*.sh' -not -path './.git/*')
          exit $status
